# Copy this file to sample_preparation.yaml and replace all placeholder paths.
# Relative paths are resolved against project_root, which is itself resolved
# relative to the directory containing this YAML file.

project_root: ".."
random_seed: 2023
output_crs: "EPSG:4326"

logging:
  level: "INFO"

inputs:
  gedi:
    path: "data/raw/gedi/gedi_l2a_points.gpkg"
    rh98_field: "rh98"
    quality_flag_field: "quality_flag"
    degrade_flag_field: "degrade_flag"
    num_detectedmodes_field: "num_detectedmodes"
    sensitivity_field: "sensitivity"

  # One categorical expansion-year raster:
  # 0 = non-impervious; 2016 = baseline impervious surface;
  # 2017-2023 = impervious expansion occurring in that year.
  icpis_core:
    path: "data/raw/icpis/icpis_expansion_year_2016_2023.tif"

  glo_bfp:
    path: "data/raw/reference_height/3d_globfp_2020.tif"
    bands: [1]
    scale: 1.0
    offset: 0.0

  g3due:
    path: "data/raw/reference_height/g3due_2010.tif"
    bands: [1]
    scale: 1.0
    offset: 0.0

  # Recommended: export the gray_std band generated by the GEE code and set
  # its path here. When a path is supplied, Python samples this raster directly
  # and ignores planet_annual. Leave null to recompute SD from annual RGB files.
  planet_gray_sd:
    path: null
    bands: [1]

  # Fallback when planet_gray_sd.path is null. The listed bands must be R, G, B.
  # Python reproduces Gray = 0.3R + 0.59G + 0.11B, followed by the standard
  # deviation of the eight annual Gray values, matching the GEE code.
  planet_annual:
    - {year: 2016, path: "data/raw/planet/planet_2016.tif", bands: [1, 2, 3]}
    - {year: 2017, path: "data/raw/planet/planet_2017.tif", bands: [1, 2, 3]}
    - {year: 2018, path: "data/raw/planet/planet_2018.tif", bands: [1, 2, 3]}
    - {year: 2019, path: "data/raw/planet/planet_2019.tif", bands: [1, 2, 3]}
    - {year: 2020, path: "data/raw/planet/planet_2020.tif", bands: [1, 2, 3]}
    - {year: 2021, path: "data/raw/planet/planet_2021.tif", bands: [1, 2, 3]}
    - {year: 2022, path: "data/raw/planet/planet_2022.tif", bands: [1, 2, 3]}
    - {year: 2023, path: "data/raw/planet/planet_2023.tif", bands: [1, 2, 3]}

sample_selection:
  gedi_quality_control:
    quality_flag: 1
    degrade_flag: 0
    num_detectedmodes_greater_than: 1
    sensitivity_greater_than: 0.9

  relative_difference:
    # QGIS equivalent: abs(("H1" - "H2") / "H2")
    formula: "abs((H1-H2)/H2)"
    epsilon: 1.0e-6

  impervious_core:
    radius_m: 12.5
    # Used only when the raster CRS is geographic rather than metric.
    # For a 5 m raster, 3 pixels is the conservative approximation of 12.5 m.
    core_radius_pixels: null
    # Only the pre-existing 2016 impervious class is eligible. Classes
    # 2017-2023 represent later expansion and are excluded from stable samples.
    impervious_values: [2016]

  tall:
    minimum_height_m: 5.0
    maximum_rd: 0.2

  low_rise:
    minimum_height_m: 0.0
    maximum_height_m: 5.0
    maximum_rd: 0.1
    target_count: 50000
    candidate_multiplier: 10
    # Optional independent point layer. If omitted, candidates are sampled
    # reproducibly from low-rise pixels in the 3D-GloBFP raster.
    candidate_points: null

  planet_sd:
    minimum: 46.34
    maximum: 183.53
    rgb_weights: [0.3, 0.59, 0.11]
    # ee.Reducer.stdDev(), rather than sampleStdDev(), corresponds to ddof=0.
    ddof: 0
    # GEE reducers ignore masked inputs. Use 8 here if complete annual coverage
    # is required; use 2 to mimic the minimum needed to calculate temporal SD.
    minimum_valid_years: 2

outputs:
  directory: "outputs/sample_preparation"
  stem: "training_samples_2016_2023"
